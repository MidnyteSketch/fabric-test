plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "patches" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

def encodedResourcesDir = file("art_source/encoded_resources")
def decodedResourcesDir = layout.buildDirectory.dir("generated/decoded_resources")

def decodeBinaryResources = tasks.register("decodeBinaryResources") {
    inputs.dir(encodedResourcesDir)
    outputs.dir(decodedResourcesDir)

    doLast {
        File outputRoot = decodedResourcesDir.get().asFile
        delete(outputRoot)
        if (!encodedResourcesDir.exists()) {
            return
        }

        fileTree(encodedResourcesDir).matching { include "**/*.b64" }.each { File encodedFile ->
            String relativePath = encodedResourcesDir.toPath().relativize(encodedFile.toPath()).toString()
            relativePath = relativePath.substring(0, relativePath.length() - ".b64".length())
            File outputFile = new File(outputRoot, relativePath)
            outputFile.parentFile.mkdirs()
            outputFile.bytes = Base64.decoder.decode(encodedFile.text.replaceAll("\\s", ""))
        }
    }
}

sourceSets.main.resources.srcDir(decodeBinaryResources)

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
