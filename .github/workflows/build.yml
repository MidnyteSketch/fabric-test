name: Build Patches

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Patches
        run: gradle build

      - name: Upload playable Patches JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: patches-0.1.0-test1.jar
          path: build/libs/patches-0.1.0-test1.jar
          archive: false
